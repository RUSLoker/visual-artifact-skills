name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan working files for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact
      - name: Scan full Git history for secrets
        run: docker run --rm -e GIT_MASTER=1 -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --log-opts=--all
      - name: Test CLI and HTTP behavior
        run: docker run --rm -v "$PWD:/pkg:ro" -w /pkg node:24.19.0-slim node --test test/artifacts.test.mjs
      - name: Inspect installable files
        run: docker run --rm -v "$PWD:/pkg:ro" -w /pkg node:24.19.0-slim npm pack --dry-run --json
